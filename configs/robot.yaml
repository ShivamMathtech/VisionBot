name: VisionBot Generic 6DOF
# Standard DH: a, d (millimetres), alpha and offset (degrees).
joints:
  - {a: 0, d: 80, alpha: 90, offset: 0, min: -150, max: 150, velocity: 35, acceleration: 70}
  - {a: 160, d: 0, alpha: 0, offset: 0, min: -40, max: 150, velocity: 30, acceleration: 60}
  - {a: 140, d: 0, alpha: 0, offset: 0, min: -150, max: 150, velocity: 35, acceleration: 70}
  - {a: 40, d: 0, alpha: 90, offset: 0, min: -150, max: 150, velocity: 40, acceleration: 80}
  - {a: 0, d: 0, alpha: -90, offset: 0, min: -100, max: 100, velocity: 40, acceleration: 80}
  - {a: 0, d: 40, alpha: 0, offset: 0, min: -150, max: 150, velocity: 40, acceleration: 80}
home: [0, 55, -95, 40, 0, 0]
workspace: {min: [-440, -440, 5], max: [440, 440, 480]}
# Conservative link centreline radius, excluding base mount.
link_radius: 10
forbidden_zones: []
